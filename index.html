<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 遊戲地圖大猜謎！</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; margin: 0; }
        .container { display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        /* 題目大圖區 */
        .quiz-image { width: 600px; height: 350px; border: 4px solid #333; background: #222; object-fit: cover; }
        
        /* 底部地圖與計分區 */
        .game-area { display: flex; margin-top: 20px; gap: 40px; align-items: center; }
        
        /* 互動小地圖（猜測區） */
        .map-wrapper { position: relative; width: 300px; height: 300px; cursor: crosshair; }
        .minimap { width: 100%; height: 100%; border: 2px solid #fff; }
        
        /* 玩家點擊的紅點標籤 */
        .pin { position: absolute; width: 10px; height: 10px; background: red; border-radius: 50%; transform: translate(-50%, -50%); display: none; }
        /* 正確答案的綠點標籤 */
        .ans-pin { position: absolute; width: 10px; height: 10px; background: #00ffcc; border-radius: 50%; transform: translate(-50%, -50%); display: none; }
        
        button { padding: 10px 20px; font-size: 16px; background: #00ffcc; color: #000; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🧭 這是遊戲裡的哪裡？</h1>
    <p>看上方的風景照，並在下方的全景地圖上點擊你認為正確的位置！</p>

    <!-- 1. 題目照片 -->
    <img src="quiz1.jpg" class="quiz-image" alt="題目風景照（請自行替換成你的遊戲截圖）">

    <div class="game-area">
        <!-- 2. 右下角小地圖（附帶點擊功能） -->
        <div class="map-wrapper" id="mapWrapper" onclick="placePin(event)">
            <img src="full_map.jpg" class="minimap" alt="全景地圖（請自行替換成遊戲小地圖）">
            <div id="playerPin" class="pin"></div>
            <div id="answerPin" class="ans-pin"></div>
        </div>

        <!-- 3. 控制與計分面板 -->
        <div>
            <button onclick="submitAnswer()">提交答案</button>
            <h2 id="scoreResult">得分：--</h2>
            <p id="distanceResult"></p>
        </div>
    </div>
</div>

<script>
    // 設定這張題目照片的「真實座標」(在 300x300 的地圖中的像素位置)
    // 假設這張照片是在地圖正中央偏右上一點點的地方拍的
    const correctX = 180; 
    const correctY = 120;

    let guessedX = null;
    let guessedY = null;

    // 當玩家點擊小地圖時
    function placePin(event) {
        const rect = document.getElementById('mapWrapper').getBoundingClientRect();
        // 計算出相對於地圖圖片內部的 X, Y 座標
        guessedX = event.clientX - rect.left;
        guessedY = event.clientY - rect.top;

        // 把紅點移到玩家點擊的位置
        const pin = document.getElementById('playerPin');
        pin.style.left = guessedX + 'px';
        pin.style.top = guessedY + 'px';
        pin.style.display = 'block';
    }

    // 當玩家點擊提交時
    function submitAnswer() {
        if (guessedX === null) {
            alert('請先在地圖上點擊你的猜測位置！');
            return;
        }

        // 顯示正確答案的綠點
        const ansPin = document.getElementById('answerPin');
        ansPin.style.left = correctX + 'px';
        ansPin.style.top = correctY + 'px';
        ansPin.style.display = 'block';

        // 核心：使用數學公式計算兩點距離 $d = \sqrt{(x_1-x_2)^2 + (y_1-y_2)^2}$
        const dx = guessedX - correctX;
        const dy = guessedY - correctY;
        const distance = Math.sqrt(dx * dx + dy * dy);

        // 根據距離換算分數（距離為0得到 5000滿分，越遠扣越多，最低0分）
        let score = Math.round(5000 - (distance * 25));
        if (score < 0) score = 0;

        // 顯示結果
        document.getElementById('scoreResult').innerText = `得分：${score} / 5000`;
        document.getElementById('distanceResult').innerText = `誤差距離：${Math.round(distance)} 像素`;
    }
</script>

</body>
</html>
