<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1～25 反應速度挑戰</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    text-align:center;
    background:#f5f5f5;
}

h1{
    margin-bottom:10px;
}

#timer{
    font-size:32px;
    font-weight:bold;
    color:#ff5722;
    margin:15px 0;
}

#bestTime{
    font-size:20px;
    color:#2196f3;
    font-weight:bold;
    margin-bottom:20px;
}

#game{
    width:min(95vw,500px);
    margin:auto;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
    border-radius:12px;
}

.cell{
    aspect-ratio:1/1;
    border:none;
    border-radius:12px;
    background:white;
    font-size:28px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 2px 5px rgba(0,0,0,.15);
    transition:.2s;
}

.cell:hover{
    transform:scale(1.05);
}

.correct{
    background:#4caf50;
    color:white;
}

.wrong{
    background:#ff4d4d !important;
    color:white;
    animation:shake .3s;
}

@keyframes shake{
    0%{transform:translateX(0);}
    25%{transform:translateX(-5px);}
    50%{transform:translateX(5px);}
    75%{transform:translateX(-5px);}
    100%{transform:translateX(0);}
}

.gameWrong{
    animation:gameFlash .3s;
}

@keyframes gameFlash{
    0%{background:transparent;}
    50%{background:rgba(255,0,0,.15);}
    100%{background:transparent;}
}

#restart{
    margin-top:25px;
    padding:12px 24px;
    border:none;
    border-radius:10px;
    background:#2196f3;
    color:white;
    font-size:18px;
    cursor:pointer;
}

#restart:hover{
    opacity:.9;
}

@media(max-width:600px){

    .cell{
        font-size:22px;
    }

    #timer{
        font-size:28px;
    }
}
</style>
</head>
<body>

<h1>1～25 反應速度挑戰</h1>
<p>請依序點擊 1 → 25</p>

<div id="timer">0.000 秒</div>
<div id="bestTime">最佳紀錄：尚無</div>

<div id="game"></div>

<button id="restart">重新開始</button>

<script>

const game = document.getElementById("game");
const timerDisplay = document.getElementById("timer");
const bestTimeDisplay = document.getElementById("bestTime");
const restartBtn = document.getElementById("restart");

let currentNumber = 1;
let startTime = null;
let timerInterval = null;
let gameStarted = false;

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
}

function loadBestTime(){

    const best = localStorage.getItem("bestTime25");

    if(best){
        bestTimeDisplay.textContent =
        `最佳紀錄：${best} 秒`;
    }else{
        bestTimeDisplay.textContent =
        "最佳紀錄：尚無";
    }
}

function startGame(){

    game.innerHTML = "";

    clearInterval(timerInterval);

    currentNumber = 1;
    startTime = null;
    gameStarted = false;

    timerDisplay.textContent = "0.000 秒";

    const numbers = [];

    for(let i=1;i<=25;i++){
        numbers.push(i);
    }

    shuffle(numbers);

    numbers.forEach(num=>{

        const btn = document.createElement("button");

        btn.className = "cell";
        btn.textContent = num;

        btn.addEventListener("click",()=>{

            // 點錯
            if(num !== currentNumber){

                btn.classList.add("wrong");
                game.classList.add("gameWrong");

                setTimeout(()=>{
                    btn.classList.remove("wrong");
                },300);

                setTimeout(()=>{
                    game.classList.remove("gameWrong");
                },300);

                return;
            }

            // 點到1開始計時
            if(num === 1 && !gameStarted){

                gameStarted = true;
                startTime = Date.now();

                timerInterval = setInterval(()=>{

                    const elapsed =
                    ((Date.now()-startTime)/1000).toFixed(3);

                    timerDisplay.textContent =
                    `${elapsed} 秒`;

                },10);
            }

            btn.classList.add("correct");
            btn.disabled = true;

            // 完成
            if(currentNumber === 25){

                clearInterval(timerInterval);

                const finalTime =
                ((Date.now()-startTime)/1000).toFixed(3);

                timerDisplay.textContent =
                `完成！成績：${finalTime} 秒 🎉`;

                const best =
                localStorage.getItem("bestTime25");

                if(
                    !best ||
                    parseFloat(finalTime) <
                    parseFloat(best)
                ){

                    localStorage.setItem(
                        "bestTime25",
                        finalTime
                    );

                    bestTimeDisplay.textContent =
                    `最佳紀錄：${finalTime} 秒 🏆`;
                }

                return;
            }

            currentNumber++;

        });

        game.appendChild(btn);

    });

    loadBestTime();
}

restartBtn.addEventListener(
    "click",
    startGame
);

loadBestTime();
startGame();

</script>

</body>
</html>
