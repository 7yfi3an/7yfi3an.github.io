<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕵️ 替崴崴尋找幸福：孟孟你在哪TT </title>
    <style>
        body { 
            background: #0d0e15; 
            color: #fff; 
            font-family: sans-serif; 
            text-align: center; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        h1 { text-shadow: 0 0 15px #ff007f; margin-bottom: 5px; font-size: 28px; }
        .subtitle { color: #8a8f98; margin-top: 0; margin-bottom: 25px; }
        
        /* 遊戲舞台 */
        .stage { 
            display: flex; 
            flex-direction: row; 
            gap: 40px; 
            align-items: flex-start; 
            background: #161925; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            border: 1px solid #252終於忘記你的時候你出現在我的孟裡", x: 367, y: 236 }
    ];

    let currentRound = 0;
    let guessedX = null;
    let guessedY = null;
    let isSubmitted = false;
    let totalScore = 0;

    function startRound(roundIndex) {
        currentRound = roundIndex;
        isSubmitted = false;
        
        if(currentRound === faces.length - 1) {
            document.getElementById('nextBtn').innerText = "查看崴孟真愛大結局 ➔";
        } else {
            document.getElementById('nextBtn').innerText = "尋找下一個孟孟 ➔";
        }
        
        const quizImg = document.getElementById('quizImage');
        const face = faces[currentRound];
        
        document.getElementById('quizLabel').innerText = `${face.name}`;
        
        // 放大對齊
        const offsetX = 160 - (face.x * 4.8);
        const offsetY = 160 - (face.y * 4.8);
        
        quizImg.style.left = offsetX + 'px';
        quizImg.style.top = offsetY + 'px';
        
        document.getElementById('playerPin').style.display = 'none';
        document.getElementById('answerPin').style.display = 'none';
        document.getElementById('scoreResult').innerText = "本關感應值：--";
        document.getElementById('distanceResult').innerText = "點擊地圖，鎖定孟孟的位置！";
        guessedX = null; guessedY = null;
        
        const canvas = document.getElementById('lineCanvas');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function placePin(event) {
        if (isSubmitted) return;
        const rect = document.getElementById('mapWrapper').getBoundingClientRect();
        guessedX = event.clientX - rect.left;
        guessedY = event.clientY - rect.top;
        
        const pin = document.getElementById('playerPin');
        pin.style.left = guessedX + 'px';
        pin.style.top = guessedY + 'px';
        pin.style.display = 'block';
        document.getElementById('distanceResult').innerText = "崴崴直覺在這裡！請點擊「提交答案」！";
    }

    function submitAnswer() {
        if (guessedX === null || isSubmitted) return;
        isSubmitted = true;
        const face = faces[currentRound];
        
        const ansPin = document.getElementById('answerPin');
        ansPin.style.left = face.x + 'px';
        ansPin.style.top = face.y + 'px';
        ansPin.style.display = 'block';

        const dx = guessedX - face.x;
        const dy = guessedY - face.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        let score = Math.round(5000 - (distance * 28));
        if (score < 0) score = 0;
        
        totalScore += score;

        document.getElementById('scoreResult').innerText = `本關感應值：${score} / 5000`;
        
        if(score > 4300) {
            document.getElementById('distanceResult').innerText = `太閃了吧！誤差僅 ${Math.round(distance)} 像素，這絕對是命定真愛！`;
        } else {
            document.getElementById('distanceResult').innerText = `天啊誤差了 ${Math.round(distance)} 像素！崴崴你是不是認錯孟孟了？`;
        }
        
        // 畫虛線
        const canvas = document.getElementById('lineCanvas');
        canvas.width = 500;
        canvas.height = 333;
        const ctx = canvas.getContext('2d');
        ctx.beginPath();
        ctx.strokeStyle = '#ff3333';
        ctx.lineWidth = 3;
        ctx.setLineDash([5, 5]);
        ctx.moveTo(guessedX, guessedY);
        ctx.lineTo(face.x, face.y);
        ctx.stroke();
    }

    function nextRound() {
        if (!isSubmitted) {
            alert("請先提交答案，測試你們的感應值！");
            return;
        }
        
        let next = currentRound + 1;
        if (next >= faces.length) {
            showEnding();
        } else {
            startRound(next);
        }
    }

    // 🌟 最終崴孟大結局評價
    function showEnding() {
        document.getElementById('totalScoreText').innerText = `最終幸福指數：${totalScore} / 15000`;
        
        let comment = "";
        if (totalScore >= 13500) {
            comment = "恭喜達成【真愛無敵 朝思孟想終於找到泥】結局！崴崴在六個一模一樣的魔性臉孔中完成了神級感應！這波幸福狗糧直接把整個網頁給閃炸了";
        } else if (totalScore >= 8000) {
            comment = "達成【差點認錯 崴孟受一點傷】結局！雖然順利找到了，但崴崴中間好幾次差點把別人的魔性臉孔當成孟孟，崴崴趕快打電話給媽媽求救吧吧！";
        } else {
            comment = "達成【世界上最遙遠的距離 原來是孟一場】結局！幸福指數慘不忍睹，崴崴你根本認不出孟孟在哪裡！建議立刻重啟網頁，重新修煉你們的心靈感應！";
        }
        
        document.getElementById('endingComment').innerText = comment;
        document.getElementById('endingScreen').classList.add('show');
    }

    function restartGame() {
        totalScore = 0;
        document.getElementById('endingScreen').classList.remove('show');
        startRound(0);
    }

    window.onload = function() {
        startRound(0);
    };
</script>
</body>
</html>
