<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕵️ 替崴崴尋找幸福：孟孟你在哪TT</title>
    <style>
        body { 
            background: #0d0e15; 
            color: #fff; 
            font-family: sans-serif; 
            text-align: center; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        h1 { text-shadow: 0 0 15px #ff007f; margin-bottom: 5px; font-size: 28px; }
        .subtitle { color: #8a8f98; margin-top: 0; margin-bottom: 25px; }
        
        /* 遊戲舞台 */
        .stage { 
            display: flex; 
            flex-direction: row; 
            gap: 40px; 
            align-items: flex-start; 
            background: #161925; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            border: 1px solid #252a3e; 
            position: relative;
        }

        .quiz-container, .map-container { display: flex; flex-direction: column; align-items: center; }
        .quiz-label { font-size: 18px; font-weight: bold; color: #ff007f; margin-bottom: 10px; text-shadow: 0 0 8px rgba(255,0,127,0.5); }
        .map-label { font-size: 18px; font-weight: bold; color: #00ffcc; margin-bottom: 10px; text-shadow: 0 0 8px rgba(0,255,204,0.5); }

        /* 局部放大區 */
        .quiz-box { 
            width: 320px; 
            height: 320px; 
            border: 4px solid #ff007f; 
            border-radius: 12px; 
            overflow: hidden; 
            position: relative; 
            background: #000; 
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.4); 
        }

        .quiz-image { 
            position: absolute; 
            transform-origin: 0 0; 
            transform: scale(4.5); /* 放大4.5倍，看清魔性細節 */
            width: 500px; 
            height: auto; 
        }
        
        /* 全景點擊區 */
        .map-wrapper { 
            position: relative; 
            width: 500px; 
            cursor: crosshair; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 4px solid #00ffcc; 
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4); 
            line-height: 0; 
        }

        .minimap { width: 100%; height: auto; display: block; }
        
        /* 標記點 */
        .pin { position: absolute; width: 16px; height: 16px; background: #ff3333; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); display: none; z-index: 10; box-shadow: 0 0 8px #ff3333; }
        .ans-pin { position: absolute; width: 16px; height: 16px; background: #00ffcc; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); display: none; z-index: 10; box-shadow: 0 0 12px #00ffcc; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        
        /* 下方面板 */
        .control-panel { margin-top: 25px; background: #161925; padding: 20px 40px; border-radius: 15px; border: 1px solid #252a3e; display: flex; gap: 50px; align-items: center; }
        .score-box h2 { margin: 0; font-size: 24px; color: #ffe600; }
        .score-box p { margin: 5px 0 0 0; color: #a0a5b0; }
        .btn-group { display: flex; gap: 15px; }
        
        button { padding: 12px 28px; font-size: 16px; background: #00ffcc; color: #0b0c10; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        button:hover { background: #00ccaa; transform: translateY(-2px); }
        button.next-btn { background: #ff007f; color: #fff; }
        button.next-btn:hover { background: #cc0066; }

        /* 終極結尾大字報彈窗 */
        .ending-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 12, 16, 0.98);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .ending-screen.show { opacity: 1; pointer-events: auto; }
        .ending-title { font-size: 36px; color: #ff007f; text-shadow: 0 0 20px rgba(255,0,127,0.6); margin-bottom: 10px; font-weight: bold; }
        .ending-score { font-size: 32px; color: #ffe600; margin-bottom: 20px; }
        .ending-comment { font-size: 20px; color: #fff; max-width: 80%; line-height: 1.6; margin-bottom: 30px; }
    </style>
</head>
<body>

    <h1>🕵️ 替崴崴尋找幸福：孟孟你在哪TT</h1>
    <p class="subtitle">六個複製人魔性臉孔中，誰才是真正的孟孟？請看左邊局部放大，在右邊盲猜出她的座標！</p>

    <div class="stage" id="stageBlock">
        <div class="quiz-container">
            <div class="quiz-label" id="quizLabel">心靈感應連線中...</div>
            <div class="quiz-box">
                <img src="" class="quiz-image" id="quizImage">
            </div>
        </div>

        <div class="map-container">
            <div class="map-label">在這裡找出幸福的座標：</div>
            <div class="map-wrapper" id="mapWrapper" onclick="placePin(event)">
                <img src="" class="minimap" id="mainMap">
                <div id="playerPin" class="pin"></div>
                <div id="answerPin" class="ans-pin"></div>
                <canvas id="lineCanvas"></canvas>
            </div>
        </div>

        <div class="ending-screen" id="endingScreen">
            <div class="ending-title">💖 崴孟心靈感應測驗完成 💖</div>
            <div class="ending-score" id="totalScoreText">最終幸福指數：0 / 15000</div>
            <div class="ending-comment" id="endingComment">評價計算中...</div>
            <button onclick="restartGame()">重新測試真愛 ↺</button>
        </div>
    </div>

    <div class="control-panel">
        <div class="score-box">
            <h2 id="scoreResult">本關感應值：--</h2>
            <p id="distanceResult">點擊地圖，鎖定孟孟的位置！</p>
        </div>
        <div class="btn-group">
            <button onclick="submitAnswer()">提交答案</button>
            <button class="next-btn" id="nextBtn" onclick="nextRound()">尋找下一個孟孟 ➔</button>
        </div>
    </div>

<script>
    // 💥 終極大絕招：把你的迷因圖片直接「打碎成程式碼密碼」，這下全世界沒有任何人能阻擋這張圖加載了！
    const finalSafeMeme = "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBMRXhpZgAATU0AKgAAAAgAAgESAAMAAAABAAEAAIdpAAQAAAABAAAAJgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAADwKADAAQAAAABAAABwgAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmgiZfnLI0J/8AAEQgBwgPAAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHAkKC/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usf466mCg4SFhoeIiYqSk5SVl6Y29kZ3N3eHl6f3yFl5eYmZqbup6en3dxsfExcbHyMnKy0tPU1dbX2Nna4eX56hp6v9r19vf49vbl5ceX15eb39fd3dB3f3h3eHf6f/aAAwDAQICEkJggg==/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAIBAQEBAQIBAQECAgICAgQDAgICAgUEBAMEBgUGBgYFBgYGBwkIBgcJBwYGCAsICQoKCgoKBggLDAsKDAkKCgr/2wBDAQICAgICAgUDAwUKBwYHCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgr/wAARCAHCA+gDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usf466mCg4SFhoeIiYqSk5SVl6Y29kZ3N3eHl6f3yFl5eYmZqbup6en3dxsfExcbHyMnKy0tPU1dbX2Nna4eX56hp6v9r19vf49vbl5ceX15eb39fd3dB3f3h3eHf6f/aAAwDAQICEkJggg==";

    // 將圖片塞入網頁元素中
    document.getElementById('mainMap').src = finalSafeMeme;
    document.getElementById('quizImage').src = finalSafeMeme;

    // 🎯 專屬崴孟客製化關卡設定
    const faces = [
        { name: "第一關：左上角那位正在「深情凝視」的孟孟", x: 92, y: 104 },
        { name: "第二關：正下方那位笑得崴崴心裡發寒的孟孟", x: 246, y: 220 },
        { name: "第三關：右下角自帶 V 字手勢、暗示幸福的帥氣孟孟", x: 367, y: 236 }
    ];

    let currentRound = 0;
    let guessedX = null;
    let guessedY = null;
    let isSubmitted = false;
    let totalScore = 0;

    function startRound(roundIndex) {
        currentRound = roundIndex;
        isSubmitted = false;
        
        if(currentRound === faces.length - 1) {
            document.getElementById('nextBtn').innerText = "查看崴孟真愛大結局 ➔";
        } else {
            document.getElementById('nextBtn').innerText = "尋找下一個孟孟 ➔";
        }
        
        const quizImg = document.getElementById('quizImage');
        const face = faces[currentRound];
        
        document.getElementById('quizLabel').innerText = `${face.name}`;
        
        // 核心放大位置對齊計算
        const offsetX = 160 - (face.x * 4.5);
        const offsetY = 160 - (face.y * 4.5);
        
        quizImg.style.left = offsetX + 'px';
        quizImg.style.top = offsetY + 'px';
        
        document.getElementById('playerPin').style.display = 'none';
        document.getElementById('answerPin').style.display = 'none';
        document.getElementById('scoreResult').innerText = "本關感應值：--";
        document.getElementById('distanceResult').innerText = "點擊地圖，鎖定孟孟的位置！";
        guessedX = null; guessedY = null;
        
        const canvas = document.getElementById('lineCanvas');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function placePin(event) {
        if (isSubmitted) return;
        const rect = document.getElementById('mapWrapper').getBoundingClientRect();
        guessedX = event.clientX - rect.left;
        guessedY = event.clientY - rect.top;
        
        const pin = document.getElementById('playerPin');
        pin.style.left = guessedX + 'px';
        pin.style.top = guessedY + 'px';
        pin.style.display = 'block';
        document.getElementById('distanceResult').innerText = "崴崴直覺在這裡！請點擊「提交答案」！";
    }

    function submitAnswer() {
        if (guessedX === null || isSubmitted) return;
        isSubmitted = true;
        const face = faces[currentRound];
        
        const ansPin = document.getElementById('answerPin');
        ansPin.style.left = face.x + 'px';
        ansPin.style.top = face.y + 'px';
        ansPin.style.display = 'block';

        const dx = guessedX - face.x;
        const dy = guessedY - face.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        let score = Math.round(5000 - (distance * 28));
        if (score < 0) score = 0;
        
        totalScore += score;

        document.getElementById('scoreResult').innerText = `本關感應值：${score} / 5000`;
        
        if(score > 4200) {
            document.getElementById('distanceResult').innerText = `太閃了吧！誤差僅 ${Math.round(distance)} 像素，這絕對是命定真愛！`;
        } else {
            document.getElementById('distanceResult').innerText = `天啊誤差了 ${Math.round(distance)} 像素！崴崴你是不是認錯孟孟了？`;
        }
        
        // 畫虛線
        const canvas = document.getElementById('lineCanvas');
        canvas.width = 500;
        canvas.height = 333;
        const ctx = canvas.getContext('2d');
        ctx.beginPath();
        ctx.strokeStyle = '#ff3333';
        ctx.lineWidth = 3;
        ctx.setLineDash([5, 5]);
        ctx.moveTo(guessedX, guessedY);
        ctx.lineTo(face.x, face.y);
        ctx.stroke();
    }

    function nextRound() {
        if (!isSubmitted) {
            alert("請先提交答案，測試你們的感應值！");
            return;
        }
        
        let next = currentRound + 1;
        if (next >= faces.length) {
            showEnding();
        } else {
            startRound(next);
        }
    }

    function showEnding() {
        document.getElementById('totalScoreText').innerText = `最終幸福指數：${totalScore} / 15000`;
        
        let comment = "";
        if (totalScore >= 13500) {
            comment = "恭喜達成【真愛無敵】結局！崴崴在六個一模一樣的魔性臉孔中完成了神級感應！這波狗糧直接把整個網頁給閃炸了，期末老師絕對雙手奉上 A+！";
        } else if (totalScore >= 8000) {
            comment = "達成【差點認錯】結局！雖然順利找到了，但崴崴中間好幾次差點把別人的魔性臉孔當成孟孟，回家準備跪算盤吧！";
        } else {
            comment = "達成【世界上最遙遠的距離】結局！幸福指數慘不忍睹，崴崴你根本認不出孟孟在哪裡！建議立刻重啟網頁，重新修煉你們的心靈感應！";
        }
        
        document.getElementById('endingComment').innerText = comment;
        document.getElementById('endingScreen').classList.add('show');
    }

    function restartGame() {
        totalScore = 0;
        document.getElementById('endingScreen').classList.remove('show');
        startRound(0);
    }

    window.onload = function() {
        startRound(0);
    };
</script>
</body>
</html>
